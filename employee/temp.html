<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css"> <!-- External CSS -->
    <link rel="stylesheet" href="temp.css">
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-blue-800 shadow-md sticky top-0 z-50 gradient-background">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="logo flex items-center space-x-2">
                <img src="../assets/logo.jpg" alt="AutoCure Logo" class="h-10 w-10"> 
                <span class="text-white text-2xl font-bold">AutoCure Hub</span>
            </div>
            <div class="flex items-center space-x-8"> 
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="hover:text-blue-300 text-white text-lg font-semibold">Home</a></li>
                    <li><a href="#tasks" class="hover:text-blue-300 text-white text-lg font-semibold">Tasks</a></li>
                    <li><a href="#schedule" class="hover:text-blue-300 text-white text-lg font-semibold">Schedule</a></li>
                    <li><a href="#notifications" class="hover:text-blue-300 text-white text-lg font-semibold">Notifications</a></li>
                </ul>
                <div class="flex space-x-4">
                    <button id="darkModeToggle" class="text-white text-lg"><i class="fas fa-moon"></i></button>
                    <button class="bg-white text-blue-800 px-5 py-2 text-lg font-semibold rounded-md hover:bg-gray-200" id="logoutBtn">Logout</button>
                    <img src="../assets/image-person.png" alt="AutoCure Logo" class="h-10 w-10 " id="clientImage">
                </div>
            </div>
        </div>
    </nav>
    
    <div class="flex">
        <!-- Sidebar -->
        <aside class="bg-gray-800 text-white w-64 p-4 min-h-screen">
            <ul>
                <li><a href="#tasks" class="block py-2 hover:bg-blue-700 rounded">My Tasks</a></li>
                <li><a href="#schedule" class="block py-2 hover:bg-blue-700 rounded">Daily Schedule</a></li>
                <li><a href="#performance" class="block py-2 hover:bg-blue-700 rounded">Performance</a></li>
                <li><a href="#messages" class="block py-2 hover:bg-blue-700 rounded">Messages</a></li>
                <li><a href="#feedback" class="block py-2 hover:bg-blue-700 rounded">Feedback</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8">
            <h2 class="text-3xl font-semibold text-blue-800 mb-6">Employee Dashboard</h2>
            
            <!-- Task Overview -->
            <section id="tasks" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-white p-6 shadow-lg rounded-lg">
                    <h3 class="text-xl font-semibold">Assigned Tasks</h3>
                    <p class="text-2xl font-bold text-blue-600">10</p>
                </div>
                <div class="bg-white p-6 shadow-lg rounded-lg">
                    <h3 class="text-xl font-semibold">Completed Tasks</h3>
                    <p class="text-2xl font-bold text-green-600">7</p>
                </div>
                <div class="bg-white p-6 shadow-lg rounded-lg">
                    <h3 class="text-xl font-semibold">Pending Tasks</h3>
                    <p class="text-2xl font-bold text-yellow-600">3</p>
                </div>
            </section>
            
            <!-- Messaging System -->
            <section id="messages" class="mt-8 bg-white shadow-lg rounded-lg p-6">
                <h2 class="text-2xl font-semibold text-blue-800">Messages</h2>
                <textarea class="w-full mt-4 p-4 border rounded-md" rows="3" placeholder="Send a message..."></textarea>
                <button class="bg-blue-600 text-white px-5 py-2 mt-4 rounded hover:bg-blue-700">Send</button>
            </section>

            <!-- Performance Reports -->
            <section id="performance" class="mt-8 bg-white shadow-lg rounded-lg p-6">
                <h2 class="text-2xl font-semibold text-blue-800">Performance Report</h2>
                <canvas id="performanceChart"></canvas>
            </section>
        </main>
    </div>
    
    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Logout Function
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '../index.html';
            }
        });

        // Dark Mode Toggle
        document.getElementById('darkModeToggle').addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });

        // Performance Chart
        const ctx = document.getElementById('performanceChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                datasets: [{
                    label: 'Tasks Completed',
                    data: [5, 10, 8, 12, 15],
                    backgroundColor: 'rgba(54, 162, 235, 0.5)'
                }]
            }
        });
    </script>
</body>
</html>
