<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <div class="cart-container">
        <h2>Your Cart</h2>
        <ul id="cartItems">
            
        </ul>
        <p class="total">Total: ₹<span id="cartTotal">0.00</span></p>
        <div class="cart-buttons">
            <button class="cancel-btn" onclick="clearCart()">Cancel</button>
            <button class="confirm-btn" onclick="confirmCart()">Confirm</button>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
